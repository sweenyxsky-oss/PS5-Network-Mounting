name: Source checks

on:
  push:
    branches: ["main", "dev/first-web-payload"]
  pull_request:
  workflow_dispatch:

jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check UI generator syntax
        run: python -m py_compile tools/embed_ui.py
      - name: Check embedded UI is up to date
        run: |
          python tools/embed_ui.py web/index.html /tmp/web_assets.hpp
          cmp native/web_assets.hpp /tmp/web_assets.hpp
      - name: Compile host API smoke-test binary
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Inative native/main.cpp native/mount_backend.cpp tests/net_stubs.cpp -pthread -o /tmp/ps5nm-host
      - name: Test HTTP API behavior
        run: python tests/http_smoke.py
      - uses: actions/checkout@v4
        with:
          repository: sweenyxsky-oss/Itemzflow
          ref: main
          path: deps/Itemzflow
      - uses: actions/checkout@v4
        with:
          repository: sweenyxsky-oss/libnfs
          ref: master
          path: deps/libnfs
      - uses: actions/checkout@v4
        with:
          repository: sahlberg/libsmb2
          ref: master
          path: deps/libsmb2
      - name: Syntax-check NFS and SMB FUSE adapters against upstream headers
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -fsyntax-only -DFUSE_USE_VERSION=26 -D_FILE_OFFSET_BITS=64 -Inative -Ideps/Itemzflow/itemz-daemon/include -Ideps/libnfs/include -Ideps/libsmb2/include native/nfs_fuse.cpp native/smb_fuse.cpp
      - name: Check protocol scope
        run: |
          grep -q 'value="nfs"' web/index.html
          grep -q 'value="smb"' web/index.html
          ! grep -Eiq 'value="(ftp|sftp)"' web/index.html
          grep -q 'native/nfs_fuse.cpp' Makefile
          grep -q 'native/smb_fuse.cpp' Makefile
      - name: Check whitespace
        run: git show --check --oneline HEAD
