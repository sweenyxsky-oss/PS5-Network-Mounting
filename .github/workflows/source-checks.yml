name: Source checks

on:
  push:
    branches: ["main", "dev/**", "chore/**"]
  pull_request:
  workflow_dispatch:

jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Check the UI generator
        run: python -m py_compile tools/embed_ui.py

      - name: Check the embedded UI is up to date
        run: |
          python tools/embed_ui.py web/index.html /tmp/web_assets.hpp
          cmp native/web_assets.hpp /tmp/web_assets.hpp

      - name: Check the wrap list matches the shim
        run: make check-arch

      - name: Host build, unit tests and HTTP smoke test
        run: make test

      - name: Syntax-check the backends against upstream headers
        run: |
          git clone --depth 1 https://github.com/sahlberg/libnfs.git deps/libnfs
          git clone --depth 1 https://github.com/sahlberg/libsmb2.git deps/libsmb2
          g++ -std=c++17 -O2 -Wall -Wextra -fsyntax-only -Inative \
            -Ideps/libnfs/include -Ideps/libsmb2/include \
            native/nfs_share.cpp native/smb_share.cpp

      - name: Check protocol scope
        run: |
          grep -q 'value="nfs"' web/index.html
          grep -q 'value="smb"' web/index.html
          ! grep -Eiq 'value="(ftp|sftp)"' web/index.html
          ! grep -q 'ITEMZFLOW' Makefile
          grep -q 'Wl,--wrap' Makefile
          grep -q 'posix_shim.cpp' Makefile
          grep -q 'native/nfs_share.cpp' Makefile
          grep -q 'native/smb_share.cpp' Makefile

      - name: Check whitespace
        run: git show --check --oneline HEAD
