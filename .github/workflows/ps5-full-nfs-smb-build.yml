name: PS5 full NFS and SMB payload build

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ps5-full-mount-targeted-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-full-payload:
    name: Build PS5 payload with NFS and SMB adapters
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      PS5_PAYLOAD_SDK: /opt/ps5-payload-sdk
      ORBISDEV: /opt/ps5-payload-sdk/target/user/homebrew
      ITEMZFLOW_ROOT: /tmp/Itemzflow
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Check out the PS5 SDK maintained by this organization
        uses: actions/checkout@v4
        with:
          repository: sweenyxsky-oss/sdk
          ref: master
          path: deps/ps5-payload-sdk

      - name: Install PS5 library build host dependencies
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config meson clang-18 lld-18 llvm-18-dev libclang-18-dev libclang-cpp18-dev libclc-18-dev libllvmspirvlib-18-dev build-essential autoconf libtool yasm nasm bison flex smpq gperf pkgconf libarchive-tools autopoint po4a git curl doxygen makepkg pacman-package-manager python3-mako python3-glad spirv-tools glslang-tools python3-packaging unzip
          sudo python3 -m pip install --break-system-packages 'meson>=1.4.0'

      - name: Build PS5 SDK and target libraries
        run: |
          set -eux
          git clone --depth 1 https://github.com/ps5-payload-dev/pacbrew-repo.git /tmp/pacbrew-repo
          cd /tmp/pacbrew-repo
          # Build the organization-maintained SDK checkout rather than pulling
          # the upstream SDK source through pacbrew's default package recipe.
          python3 - <<'PY'
          from pathlib import Path
          recipe = Path("sdk/PKGBUILD")
          contents = recipe.read_text()
          contents = contents.replace(
              "https://github.com/ps5-payload-dev/sdk.git",
              "https://github.com/sweenyxsky-oss/sdk.git",
          )
          contents = contents.replace(
              "git describe --tags --long | sed 's/^[^0-9]*//; s/\\([^-]*-g\\)/r\\1/; s/-/./g'",
              "printf '1.0.r%s.g%s' \"$(git rev-list --count HEAD)\" \"$(git rev-parse --short HEAD)\"",
          )
          if "https://github.com/sweenyxsky-oss/sdk.git" not in contents:
              raise SystemExit("failed to select the organization SDK source")
          if "git describe --tags --long" in contents:
              raise SystemExit("SDK package version still requires upstream tags")
          recipe.write_text(contents)
          PY
          # Build only target libraries used by this payload. ci-libs.sh also builds
          # unrelated graphics, media, and UI stacks and can consume the entire job timeout.
          for package in sdk openlibm libcxx zlib openssl libnfs libsmb2; do
            pushd "$package"
            rm -f ./*.pkg.tar.gz
            rm -rf src pkg
            makepkg --noconfirm -c -f -C
            sudo pacman --config "$PWD/../pacman.conf" --noconfirm -U ./ps5-payload-*.pkg.tar.gz
            popd
          done
          test -f "$PS5_PAYLOAD_SDK/toolchain/prospero.mk"
          find "$ORBISDEV/include" -maxdepth 3 \( -path '*/nfsc/libnfs.h' -o -path '*/smb2/libsmb2.h' \) -print
          test -f "$ORBISDEV/include/nfsc/libnfs.h"
          test -f "$ORBISDEV/include/smb2/libsmb2.h"
          test -f "$ORBISDEV/lib/libnfs.a"
          test -f "$ORBISDEV/lib/libsmb2.a"
          test -f "$ORBISDEV/lib/libssl.a"
          test -f "$ORBISDEV/lib/libcrypto.a"
          test -f "$ORBISDEV/lib/libz.a"

      - name: Fetch Itemzflow FUSE compatibility source
        run: |
          set -eux
          git clone --depth 1 https://github.com/LightningMods/Itemzflow.git "$ITEMZFLOW_ROOT"
          test -f "$ITEMZFLOW_ROOT/itemz-daemon/include/fuse/fuse.h"
          test -f "$ITEMZFLOW_ROOT/external/libfuse/source/fuse.c"

      - name: Compile Itemzflow FUSE library with PS5 compiler
        run: |
          set -eux
          SRC="$ITEMZFLOW_ROOT/external/libfuse/source"
          INC="$ITEMZFLOW_ROOT/external/libfuse/include"
          mkdir -p /tmp/ps5-fuse-obj
          CC="$PS5_PAYLOAD_SDK/bin/prospero-clang"
          AR="$PS5_PAYLOAD_SDK/bin/prospero-ar"
          # Itemzflow's optional module loader includes this PS4 header, which the
          # payload SDK does not ship. The application uses FUSE operations directly;
          # only these declarations are needed while compiling the compatibility layer.
          mkdir -p /tmp/ps5-fuse-compat/orbis
          cat > /tmp/ps5-fuse-compat/orbis/libkernel.h <<'EOF'
          #pragma once
          #include <stddef.h>
          #include <stdint.h>
          #include <sys/types.h>
          #include <pthread.h>
          typedef pthread_t ScePthread;
          typedef int32_t SceKernelModule;
          #define scePthreadCreate(thread, attr, start, arg, name) pthread_create((pthread_t*)(thread), (attr), (start), (arg))
          #define scePthreadJoin(thread, result) pthread_join((thread), (result))
          #define scePthreadCancel(thread) pthread_cancel((thread))
          SceKernelModule sceKernelLoadStartModule(const char*, size_t, const void*, uint32_t, const void*, int32_t*);
          int32_t sceKernelStopUnloadModule(SceKernelModule, size_t, const void*, uint32_t, const void*, int32_t*);
          int32_t sceKernelOpen(const char*, int, mode_t);
          ssize_t sceKernelWrite(int32_t, const void*, size_t);
          int32_t sceKernelClose(int32_t);
          EOF
          CFLAGS="-O2 -fPIC -D_FILE_OFFSET_BITS=64 -D_REENTRANT -DFUSE_USE_VERSION=26 -DHAVE_CONFIG_H -D__ORBIS__=1 -D_ORBIS_ -D__FreeBSD__=9 -I/tmp/ps5-fuse-compat -include /tmp/ps5-fuse-compat/orbis/libkernel.h -I$INC -I$ITEMZFLOW_ROOT/itemz-daemon/include/fuse -I$ITEMZFLOW_ROOT/itemz-daemon/include -I$ORBISDEV/include -I$ORBISDEV/include/orbis -I$PS5_PAYLOAD_SDK/target/include"
          # This PS5 integration uses the core single-threaded FUSE loop. The
          # optional subdir module is excluded; mount_bsd.c provides the required
          # fuse_kern_mount implementation for PS5 /dev/fuse.
          SOURCES="fuse.c fuse_kern_chan.c fuse_loop.c fuse_lowlevel.c fuse_loop_mt.c fuse_mt.c fuse_opt.c fuse_session.c fuse_signals.c cuse_lowlevel.c helper.c ulockmgr.c mount_bsd.c"
          for source in $SOURCES; do
            object="/tmp/ps5-fuse-obj/${source//\//_}.o"
            "$CC" $CFLAGS -c "$SRC/$source" -o "$object"
          done
          "$AR" rcs /tmp/libfuse.a /tmp/ps5-fuse-obj/*.o
          sudo install -m 0644 /tmp/libfuse.a "$ORBISDEV/lib/libfuse.a"
          test -s "$ORBISDEV/lib/libfuse.a"
          ls -lh "$ORBISDEV/lib/libfuse.a"

      - name: Build full payload with NFS and SMB enabled
        run: |
          set -eux
          make clean PS5NM_WITH_FUSE=1 PS5_PAYLOAD_SDK="$PS5_PAYLOAD_SDK" ORBISDEV="$ORBISDEV" ITEMZFLOW_ROOT="$ITEMZFLOW_ROOT"
          make PS5NM_WITH_FUSE=1 PS5_PAYLOAD_SDK="$PS5_PAYLOAD_SDK" ORBISDEV="$ORBISDEV" ITEMZFLOW_ROOT="$ITEMZFLOW_ROOT" V=1
          test -s build/PS5NetworkMounting.elf
          file build/PS5NetworkMounting.elf
          "$PS5_PAYLOAD_SDK/bin/prospero-readelf" -h build/PS5NetworkMounting.elf || readelf -h build/PS5NetworkMounting.elf
          sha256sum build/PS5NetworkMounting.elf

      - name: Upload PS5 ELF and dependency manifest
        uses: actions/upload-artifact@v4
        with:
          name: PS5NetworkMounting-full-NFS-SMB-ELF
          path: |
            build/PS5NetworkMounting.elf
          if-no-files-found: error
          retention-days: 14

      - name: Create or update GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          TAG="v1.1.4"
          TITLE="PS5 Network Mounting v1.1.4"
          cat <<'NOTES' > /tmp/release_notes.md
          ## PS5 Network Mounting v1.1.4

          ### Fixes and improvements
          - Bind the control server to all interfaces by default and report reachable console URLs for LAN clients.
          - Verify a running instance before treating a port conflict as a relaunch; unrelated listeners are reported as errors.
          - Launch or refresh the console browser with retry handling, and expose browser status and a manual launch action in the control panel.
          - Use a valid HBRW homebrew title ID for the shortcut and request a ShadowMountPlus scan when its API is available. The tile opens the running daemon panel; it does not bootstrap the payload after a reboot.
          - Recover stale FUSE mounts and clean up active mounts when the payload exits.

          ### Included artifact
          - `PS5NetworkMounting.elf`: PS5 payload built with the organization-maintained SDK and NFS/SMB FUSE adapters.
          NOTES
          sed -i 's/^          //' /tmp/release_notes.md

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists. Updating release notes and assets..."
            gh release edit "$TAG" --title "$TITLE" --notes-file /tmp/release_notes.md
            gh release upload "$TAG" build/PS5NetworkMounting.elf --clobber
          else
            echo "Creating release $TAG..."
            gh release create "$TAG" build/PS5NetworkMounting.elf --title "$TITLE" --notes-file /tmp/release_notes.md
          fi
