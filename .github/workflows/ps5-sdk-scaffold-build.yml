name: PS5 SDK scaffold build

on:
  push:
    branches:
      - main
      - dev/first-web-payload
      - chore/ps5-sdk-scaffold-build
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-scaffold:
    name: Compile UI/API scaffold with public PS5 payload SDK
    runs-on: ubuntu-latest
    env:
      PS5_PAYLOAD_SDK: /opt/ps5-payload-sdk
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out the PS5 SDK maintained by this organization
        uses: actions/checkout@v4
        with:
          repository: sweenyxsky-oss/sdk
          ref: master
          path: deps/ps5-payload-sdk

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 llvm-18-dev cmake make python3 wget

      - name: Build and install the organization PS5 payload SDK
        run: |
          set -eux
          make -C deps/ps5-payload-sdk install DESTDIR="$PS5_PAYLOAD_SDK"
          PS5_PAYLOAD_SDK="$PS5_PAYLOAD_SDK" bash deps/ps5-payload-sdk/libcxx.sh
          test -f "$PS5_PAYLOAD_SDK/toolchain/prospero.mk"

      - name: Build scaffold without filesystem adapters
        run: |
          set -eux
          make clean PS5NM_WITH_FUSE=0 PS5_PAYLOAD_SDK="$PS5_PAYLOAD_SDK"
          make PS5NM_WITH_FUSE=0 PS5_PAYLOAD_SDK="$PS5_PAYLOAD_SDK"
          test -s build/PS5NetworkMounting.elf
          file build/PS5NetworkMounting.elf

      - name: Upload scaffold ELF for inspection
        uses: actions/upload-artifact@v4
        with:
          name: PS5NetworkMounting-scaffold-ELF
          path: build/PS5NetworkMounting.elf
          if-no-files-found: error
          retention-days: 7
